<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #1c2530;
    --muted: #5d6877;
    --line: #dde1e7;
    --accent: #0e6b6b;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --danger-bg: #fbeceb;
    --ok-bg: #e6f3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --panel: #1b222b; --ink: #e8ecf1; --muted: #9aa5b3;
      --line: #2c3541; --accent: #4fb3b0; --accent-ink: #0b1316;
      --danger: #f08a82; --danger-bg: #3a1f1e; --ok-bg: #173229;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .form-panel { position: sticky; top: 16px; }
  @media (max-width: 820px) { .form-panel { position: static; } }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 16px; }
  label { display: block; font-weight: 500; font-size: .9rem; margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  input[type=text], input[type=email], input[type=password], input[type=search] {
    width: 100%; padding: 9px 11px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .hint { color: var(--muted); font-size: .82rem; margin-top: 3px; }
  .err { color: var(--danger); font-size: .85rem; margin-top: 3px; min-height: 0; }
  input.invalid { border-color: var(--danger); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button {
    font: inherit; font-weight: 500; padding: 9px 14px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger.solid { background: var(--danger); color: #fff; }
  button.small { padding: 5px 10px; font-size: .85rem; }
  button:disabled { opacity: .6; cursor: wait; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .toolbar input { max-width: 260px; }
  .count { color: var(--muted); font-size: .9rem; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: .85rem; font-weight: 500; color: var(--muted); }
  td.id { color: var(--muted); width: 48px; font-variant-numeric: tabular-nums; }
  td.row-actions { white-space: nowrap; text-align: right; }
  tr.editing td { background: var(--ok-bg); }
  .empty { text-align: center; padding: 36px 12px; color: var(--muted); }
  .banner { background: var(--danger-bg); color: var(--danger); padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; display: none; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 22px; background: var(--panel); color: var(--ink); max-width: 380px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Usuarios</h1>
  <p class="sub">Crea, edita y elimina las cuentas registradas.</p>

  <div class="layout">
    <section class="panel form-panel">
      <h2 id="form-title">Nuevo usuario</h2>
      <form id="user-form" novalidate>
        <input type="hidden" id="user-id">
        <div class="field">
          <label for="name">Nombre</label>
          <input type="text" id="name" maxlength="100" autocomplete="off">
          <div class="err" data-for="name"></div>
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="off">
          <div class="err" data-for="email"></div>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="new-password">
          <div class="hint" id="pass-hint">Mínimo 6 caracteres.</div>
          <div class="err" data-for="password"></div>
        </div>
        <div class="actions">
          <button type="submit" class="primary" id="save-btn">Crear usuario</button>
          <button type="button" id="cancel-btn" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar por nombre o correo" aria-label="Buscar usuarios">
        <span class="count" id="count"></span>
      </div>
      <div class="banner" id="banner" role="alert"></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Creado</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<dialog id="confirm">
  <h2>Eliminar usuario</h2>
  <p id="confirm-text"></p>
  <div class="actions" style="justify-content:flex-end">
    <button type="button" id="confirm-no">Cancelar</button>
    <button type="button" class="danger solid" id="confirm-yes">Eliminar</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
  // Cambia esta URL si tu API corre en otro host o puerto.
  const API = 'http://localhost:8080/api/users';

  const $ = (id) => document.getElementById(id);
  const form = $('user-form'), rows = $('rows'), banner = $('banner');
  let users = [], pendingDelete = null;

  async function request(url, options = {}) {
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) {
      const err = new Error((body && body.error) || 'Error inesperado');
      err.status = res.status;
      err.fields = (body && body.campos) || {};
      throw err;
    }
    return body;
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function showBanner(msg) {
    banner.textContent = msg;
    banner.style.display = msg ? 'block' : 'none';
  }

  function setFieldErrors(fields = {}) {
    document.querySelectorAll('.err').forEach((el) => {
      const msg = fields[el.dataset.for] || '';
      el.textContent = msg;
      $(el.dataset.for).classList.toggle('invalid', !!msg);
    });
  }

  function formatDate(value) {
    const d = new Date(String(value).replace(' ', 'T'));
    return isNaN(d) ? value : d.toLocaleString('es-PE', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const list = users.filter((u) =>
      u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
    $('count').textContent = `${list.length} de ${users.length}`;
    rows.replaceChildren();

    if (!list.length) {
      const tr = rows.insertRow();
      const td = tr.insertCell();
      td.colSpan = 5;
      td.className = 'empty';
      td.textContent = users.length
        ? 'Ningún usuario coincide con la búsqueda.'
        : 'Aún no hay usuarios. Crea el primero desde el formulario.';
      return;
    }

    list.forEach((u) => {
      const tr = rows.insertRow();
      if (String($('user-id').value) === String(u.id)) tr.className = 'editing';
      tr.insertCell().textContent = u.id;
      tr.cells[0].className = 'id';
      tr.insertCell().textContent = u.name;
      tr.insertCell().textContent = u.email;
      tr.insertCell().textContent = formatDate(u.created_at);

      const td = tr.insertCell();
      td.className = 'row-actions';
      const edit = document.createElement('button');
      edit.className = 'small'; edit.textContent = 'Editar';
      edit.onclick = () => startEdit(u.id);
      const del = document.createElement('button');
      del.className = 'small danger'; del.textContent = 'Eliminar';
      del.style.marginLeft = '6px';
      del.onclick = () => askDelete(u);
      td.append(edit, del);
    });
  }

  async function load() {
    try {
      users = await request(API);
      showBanner('');
    } catch (e) {
      users = [];
      showBanner('No se pudo cargar la lista. Revisa que la API esté activa en ' + API);
    }
    render();
  }

  function resetForm() {
    form.reset();
    $('user-id').value = '';
    $('form-title').textContent = 'Nuevo usuario';
    $('save-btn').textContent = 'Crear usuario';
    $('pass-hint').textContent = 'Mínimo 6 caracteres.';
    $('cancel-btn').hidden = true;
    setFieldErrors();
    render();
  }

  async function startEdit(id) {
    try {
      const u = await request(`${API}/${id}`);
      $('user-id').value = u.id;
      $('name').value = u.name;
      $('email').value = u.email;
      $('password').value = '';
      $('form-title').textContent = `Editar usuario #${u.id}`;
      $('save-btn').textContent = 'Guardar cambios';
      $('pass-hint').textContent = 'Déjala vacía para conservar la actual.';
      $('cancel-btn').hidden = false;
      setFieldErrors();
      render();
      $('name').focus();
    } catch (e) {
      toast(e.message);
      load();
    }
  }

  // Validación en el cliente (el servidor valida de nuevo).
  function validate() {
    const errors = {};
    const editing = !!$('user-id').value;
    if (!$('name').value.trim()) errors.name = 'El nombre es obligatorio';
    const email = $('email').value.trim();
    if (!email) errors.email = 'El correo es obligatorio';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'El correo no tiene un formato válido';
    const pass = $('password').value;
    if (!editing && !pass) errors.password = 'La contraseña es obligatoria';
    else if (pass && pass.length < 6) errors.password = 'Mínimo 6 caracteres';
    return errors;
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const errors = validate();
    setFieldErrors(errors);
    if (Object.keys(errors).length) return;

    const id = $('user-id').value;
    const payload = { name: $('name').value.trim(), email: $('email').value.trim() };
    if ($('password').value) payload.password = $('password').value;

    $('save-btn').disabled = true;
    try {
      await request(id ? `${API}/${id}` : API, {
        method: id ? 'PUT' : 'POST',
        body: JSON.stringify(payload)
      });
      toast(id ? 'Cambios guardados' : 'Usuario creado');
      resetForm();
      await load();
    } catch (e) {
      if (e.status === 400) setFieldErrors(e.fields);
      else if (e.status === 404) { toast('El usuario ya no existe'); resetForm(); load(); }
      else toast('No se pudo guardar: ' + e.message);
    } finally {
      $('save-btn').disabled = false;
    }
  });

  $('cancel-btn').onclick = resetForm;
  $('search').addEventListener('input', render);

  function askDelete(u) {
    pendingDelete = u;
    $('confirm-text').textContent = `Se eliminará a ${u.name} (${u.email}). Esta acción no se puede deshacer.`;
    $('confirm').showModal();
  }
  $('confirm-no').onclick = () => $('confirm').close();
  $('confirm-yes').onclick = async () => {
    const u = pendingDelete;
    $('confirm').close();
    try {
      await request(`${API}/${u.id}`, { method: 'DELETE' });
      toast('Usuario eliminado');
      if ($('user-id').value === String(u.id)) resetForm();
    } catch (e) {
      toast(e.status === 404 ? 'El usuario ya no existe' : 'No se pudo eliminar: ' + e.message);
    }
    load();
  };

  load();
</script>
</body>
</html>
